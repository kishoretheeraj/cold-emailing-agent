name: DB Migrate

# Manual-only Supabase migration runner, so migrations can be applied without a laptop.
#   list   -- show local vs remote migration history.
#   dryrun -- run one migration (plus an optional supabase/tests file) inside BEGIN ... ROLLBACK
#             on the real database. scripts/sql_guard.py refuses any file that could commit or
#             cannot run in a transaction, and a schema fingerprint taken before and after must
#             match, proving nothing persisted.
#   push   -- apply all pending migrations. Requires the confirm input to be exactly "push".
# Needs repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; the project ref is derived
# from SUPABASE_URL. Inputs reach the shell only through env, never ${{ }} inside run:.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list | dryrun | push'
        required: true
        type: choice
        options: [list, dryrun, push]
        default: list
      migration:
        description: 'dryrun: migration filename in supabase/migrations'
        required: false
        type: string
        default: ''
      test:
        description: 'dryrun: optional test filename in supabase/tests'
        required: false
        type: string
        default: ''
      confirm:
        description: 'push: type push to apply pending migrations'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      MODE: ${{ inputs.mode }}
      MIGRATION: ${{ inputs.migration }}
      TEST_FILE: ${{ inputs.test }}
      CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Link project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD repo secret." >&2
            exit 1
          fi
          ref="$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["SUPABASE_URL"]).hostname.split(".")[0])')"
          supabase link --project-ref "$ref" --password "$SUPABASE_DB_PASSWORD"

      - name: Migration history
        run: supabase migration list --linked

      - name: Dry run (rolled back)
        if: inputs.mode == 'dryrun'
        run: |
          python3 scripts/sql_guard.py --migration "$MIGRATION" --test "$TEST_FILE" --out "$RUNNER_TEMP/dryrun.sql"
          fingerprint() {
            supabase db query --linked --file scripts/schema_fingerprint.sql | grep -oE '[0-9a-f]{32}' | head -n1
          }
          before="$(fingerprint)"
          if [ -z "$before" ]; then echo "Could not read the schema fingerprint." >&2; exit 1; fi
          supabase db query --linked --file "$RUNNER_TEMP/dryrun.sql"
          after="$(fingerprint)"
          echo "schema fingerprint before=$before after=$after"
          if [ "$before" != "$after" ]; then
            echo "SCHEMA CHANGED DURING DRY RUN -- something committed. Investigate immediately." >&2
            exit 1
          fi
          echo "DRY RUN OK: script ran and the schema fingerprint is unchanged."

      - name: Push pending migrations
        if: inputs.mode == 'push'
        run: |
          if [ "$CONFIRM" != "push" ]; then
            echo "Refusing to push: set the confirm input to exactly 'push'." >&2
            exit 1
          fi
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          supabase migration list --linked
