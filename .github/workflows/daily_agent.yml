name: Cold Email Agent

on:
  schedule:
    - cron: '37 9 * * 1-5'   # 4:37am EST / 5:37am EDT — off-peak minute to dodge GHA queue delays
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

jobs:
  check-duplicate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
    steps:
      - name: Skip if backup already ran today
        id: dedup
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/daily_agent.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(
              .event == \"workflow_dispatch\" and
              (.created_at | startswith(\"$TODAY\")) and
              .status != \"cancelled\" and
              .conclusion != \"failure\"
            )] | length")
          if [ "$COUNT" -gt "0" ]; then
            echo "Backup trigger already ran today — skipping scheduled run."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  run-agent:
    needs: check-duplicate
    if: needs.check-duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cold email agent
        run: python agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: agent.log
          retention-days: 30

      - name: Match new companies against visa intel cache
        if: always()
        continue-on-error: true
        run: python visa_match_new.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload visa-match log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visa-match-log-${{ github.run_id }}
          path: visa_match.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: python notify_failure.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
