<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply - Continueco</title></head>
<body>
<!-- A one-page form whose submit button reads "Continue": pressing it would send the application. -->
<form id="apply" action="/received" method="post">
  <label for="fn">First name *</label><input id="fn" name="first" required>
  <label for="ln">Last name *</label><input id="ln" name="last" required>
  <label for="em">Email *</label><input id="em" name="email" type="email" required>
  <label for="cv">Resume *</label><input id="cv" name="cv" type="file" required>
  <input type="submit" value="Continue">
</form>
</body></html>
