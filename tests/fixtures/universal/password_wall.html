<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in - Fixtureco Careers</title></head>
<body>
<h1>Sign in to apply</h1>
<form id="signin"><label for="u">Email</label><input id="u" name="username" type="email">
<label for="p">Password</label><input id="p" name="password" type="password">
<button type="submit">Sign In</button> <a href="#">Create an account</a></form>
<script>window.__submitted = 0; document.getElementById('signin').addEventListener('submit', (e) => { e.preventDefault(); window.__submitted += 1; });</script>
</body></html>
