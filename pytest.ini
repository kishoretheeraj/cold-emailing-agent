[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = .
omit =
    tests/*
    setup_supabase.sql
    config.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
show_missing = True
skip_covered = False
